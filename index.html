<style>
/* Layout: demo banner, nav with language switch, hero (headline left, BTC / ETH / USDT cards right), 50-coin live table where every row opens Telegram, plans, steps, Telegram call to action. One committed dark look. */
:root {
  --bg: #050A1C;
  --bg-2: #0A1438;
  --card-a: #1B3799;
  --card-b: #11205F;
  --card-line: #3A60D4;
  --ink: #EEF3FF;
  --muted: #9DB0DD;
  --line: #1E2C5C;
  --row: #0B1534;
  --row-hover: #12214F;
  --cyan: #29D3F0;
  --cyan-ink: #03141C;
  --up: #2EE6C5;
  --down: #FF7A8A;
  --warn-bg: #3A2B0E;
  --warn-ink: #F6B84A;
  --font-body: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(900px 500px at 85% -10%, #1A3A9033, transparent 60%), radial-gradient(700px 400px at -10% 30%, #29D3F014, transparent 60%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 0 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
p { margin: 0; }
a { color: var(--cyan); }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font: 500 12px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 14px 20px; padding-block: 18px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 21px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.03em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.nav { display: flex; gap: 14px 20px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.nav > a:not(.btn) { color: var(--muted); text-decoration: none; }
.nav > a:not(.btn):hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lang button { font: 600 13px var(--font-body); padding: 7px 12px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--cyan); color: var(--cyan-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 22px; border-radius: 12px; font: 600 15px var(--font-body); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--cyan); color: var(--cyan-ink); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--card-line); }
.btn-ghost:hover { background: #ffffff0d; }
.btn svg { width: 20px; height: 20px; flex: none; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.nav .btn { padding: 8px 16px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 44px; align-items: center; padding-block: 36px 64px; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border: 1px solid #29D3F066; border-radius: 99px; background: #29D3F014; color: var(--cyan); font-weight: 600; font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); flex: none; }
.pill.live .dot { animation: pulse 1.6s ease-in-out infinite; }
.pill.demo-mode { border-color: #F6B84A66; background: #F6B84A14; color: var(--warn-ink); }
.pill.demo-mode .dot { background: var(--warn-ink); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.hero h1 { font-size: clamp(36px, 6vw, 64px); margin-top: 22px; }
.hero h1 em { font-style: normal; color: var(--cyan); }
.hero .lede { margin-top: 22px; font-size: 18px; color: var(--muted); max-width: 48ch; }
.stats { display: flex; gap: 14px 36px; flex-wrap: wrap; margin-top: 36px; }
.stats b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--muted); }

/* Price cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; min-width: 0; }
.coin-card { background: linear-gradient(150deg, var(--card-a), var(--card-b)); border: 1px solid var(--card-line); border-radius: 22px; padding: 22px; min-width: 0; position: relative; overflow: hidden; }
.coin-card:hover { border-color: var(--cyan); }
.coin-card.big { grid-column: 1 / -1; padding: 26px; }
.stretch { position: absolute; inset: 0; z-index: 2; border-radius: inherit; }
.coin-head { display: flex; align-items: center; gap: 14px; }
.badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; flex: none; }
.big .badge { width: 58px; height: 58px; font-size: 26px; }
.coin-head b { display: block; font-size: 18px; line-height: 1.2; }
.coin-head small { color: var(--muted); font-size: 14px; }
.price { font-size: clamp(28px, 4.4vw, 44px); font-weight: 800; letter-spacing: -0.03em; margin-top: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; position: relative; z-index: 1; }
.coin-card:not(.big) .price { font-size: clamp(22px, 3vw, 28px); margin-top: 14px; }
.chg { font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.up { color: var(--up); }
.down { color: var(--down); }
.spark { position: absolute; right: 0; bottom: 0; width: 55%; height: 55%; opacity: 0.9; pointer-events: none; }
.flash-up { animation: fu 0.7s ease-out; }
.flash-down { animation: fd 0.7s ease-out; }
@keyframes fu { from { color: var(--up); } }
@keyframes fd { from { color: var(--down); } }
.feed { font: 12px var(--font-mono); color: var(--muted); grid-column: 1 / -1; }

section { padding-block: 56px; border-top: 1px solid var(--line); }
.sec-head { max-width: 680px; margin-bottom: 28px; }
.sec-head h2 { font-size: clamp(28px, 4vw, 40px); margin-top: 10px; }
.sec-head p { color: var(--muted); margin-top: 12px; }

/* Trust strip + top coins */
.trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 44px; padding: 28px 16px; border-block: 1px solid var(--line); background: linear-gradient(180deg, #1B379926, #11205F14); border-radius: 4px; }
.trust > span { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
.trust svg { width: 26px; height: 26px; flex: none; fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sec-head.center { margin-inline: auto; text-align: center; }
.tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.tcard { position: relative; text-align: center; background: linear-gradient(160deg, #162A7A, #0E1B52); border: 1px solid var(--line); border-radius: 20px; padding: 30px 22px; min-width: 0; }
.tcard:hover { border-color: var(--cyan); }
.tbadge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; font-size: 28px; font-weight: 800; color: #fff; box-shadow: 0 0 28px #ffffff1a; }
.tcard h3 { font-size: 20px; }
.tcard p { margin-top: 10px; color: var(--muted); font-size: 15px; }

/* Why choose us */
.wgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.wcard { background: linear-gradient(160deg, #141F5A, #0C1546); border: 1px solid var(--line); border-radius: 20px; padding: 28px 26px; min-width: 0; }
.wicon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: #1E6E7A66; margin-bottom: 22px; }
.wcard h3 { font-size: 21px; }
.wcard p { margin-top: 10px; color: var(--muted); font-size: 15px; }

/* Markets table */
.tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.tools input { flex: 1 1 220px; max-width: 340px; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--row); color: var(--ink); font: 500 15px var(--font-body); }
.tools .meta { font: 12px var(--font-mono); color: var(--muted); }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--row); max-height: 640px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 15px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--bg-2); font: 500 11.5px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); z-index: 3; padding: 12px 16px; text-align: right; white-space: nowrap; }
th:nth-child(1), th:nth-child(2) { text-align: left; }
td { padding: 0; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
td:nth-child(1), td:nth-child(2) { text-align: left; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--row-hover); }
a.rl { display: block; padding: 12px 16px; color: inherit; text-decoration: none; }
td.rank a.rl { color: var(--muted); width: 56px; }
.name { display: flex; align-items: center; gap: 12px; }
.name .badge { width: 30px; height: 30px; font-size: 13px; }
.name-cell { display: flex; flex-direction: column; line-height: 1.25; }
.name-cell b { font-weight: 600; }
.name-cell small { color: var(--muted); }
.act { display: inline-block; padding: 3px 14px; border-radius: 99px; border: 1px solid #29D3F066; color: var(--cyan); font-weight: 600; font-size: 13px; }
tbody tr:hover .act { background: var(--cyan); color: var(--cyan-ink); }

/* Plans */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.plan { background: var(--row); border: 1px solid var(--line); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; min-width: 0; }
.plan.featured { border-color: var(--card-line); background: linear-gradient(150deg, var(--card-a), var(--card-b)); }
.plan .tag { font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); min-height: 16px; }
.plan h3 { font-size: 24px; margin-top: 6px; }
.plan .min { margin-top: 14px; font: 500 30px var(--font-mono); }
.plan .min small { font: 400 13px var(--font-body); color: var(--muted); display: block; margin-top: 2px; }
.plan ul { list-style: none; padding: 0; margin: 18px 0 22px; display: grid; gap: 10px; font-size: 15px; }
.plan li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.plan li::before { content: ""; width: 8px; height: 8px; margin-top: 8px; border-radius: 2px; background: var(--cyan); }
.plan .btn { margin-top: auto; }
.plans-note { margin-top: 16px; font-size: 13px; color: var(--muted); }

.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; counter-reset: s; }
.flow li { counter-increment: s; background: var(--row); border: 1px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; }
.flow li::before { content: counter(s); display: block; font: 500 30px var(--font-mono); color: var(--cyan); margin-bottom: 12px; }
.flow h3 { font-size: 20px; }
.flow p { color: var(--muted); font-size: 15px; margin-top: 8px; }

.cta { background: linear-gradient(150deg, var(--card-a), var(--card-b)); border: 1px solid var(--card-line); border-radius: 24px; padding: 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.cta h2 { font-size: clamp(26px, 3.6vw, 38px); }
.cta p { color: #C6D3F5; margin-top: 10px; max-width: 52ch; }
.linkline { margin-top: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 13px var(--font-mono); color: #C6D3F5; }
.linkline code { background: #00000040; padding: 6px 10px; border-radius: 6px; overflow-wrap: anywhere; color: var(--ink); }
.linkline button { font: 600 12px var(--font-body); padding: 6px 12px; border-radius: 6px; border: 1px solid #ffffff44; background: transparent; color: var(--ink); cursor: pointer; }

.cta-actions { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cta-actions .btn { width: 100%; }
.cta-note { font-size: 13px; color: #C6D3F5; text-align: center; max-width: 24ch; margin-inline: auto; }
footer { padding-top: 24px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Footer */
footer.site-foot { display: block; border-top: 1px solid var(--line); padding-top: 48px; font-size: 15px; }
.foot-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); gap: 36px; }
.foot-brand p { color: var(--muted); margin-top: 14px; max-width: 34ch; font-size: 14px; }
.foot-col { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.foot-col h4 { margin: 0 0 6px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.foot-col a { color: var(--muted); text-decoration: none; }
.foot-col a:hover { color: var(--cyan); }
.foot-bottom { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 14px; color: var(--muted); text-align: center; }
.foot-disc { font-size: 13px; max-width: 78ch; margin-inline: auto; opacity: 0.85; }

/* Legal popup */
.modal { position: fixed; inset: 0; z-index: 50; background: #000000b3; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--bg-2); border: 1px solid var(--card-line); border-radius: 18px; padding: 26px; max-width: 480px; width: 100%; }
.modal-box h3 { font-size: 22px; }
.modal-box p { color: var(--muted); margin: 12px 0 20px; }

@media (max-width: 880px) {
  .foot-grid { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .hero, .cta { grid-template-columns: minmax(0, 1fr); }
  .plans, .flow { grid-template-columns: minmax(0, 1fr); }
  .tgrid, .wgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cta { padding: 26px; }
  .hero { padding-block: 24px 48px; gap: 32px; }
}
@media (max-width: 560px) { .tgrid, .wgrid { grid-template-columns: minmax(0, 1fr); } .trust { justify-content: flex-start; padding-inline: 22px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

var BRAND = { BTC: "#F7931A", ETH: "#29A8F0", USDT: "#1FC2A0", USDC: "#2775CA", BNB: "#F3BA2F", SOL: "#8F5CF0", XRP: "#3A4A63", DOGE: "#C2A633" };

function colorFor(sym) {
  if (BRAND[sym]) return BRAND[sym];
  var h = 0; for (var i = 0; i < sym.length; i++) h = (h * 31 + sym.charCodeAt(i)) % 360;
  return "hsl(" + h + " 55% 42%)";
}
function coinHref(sym) { return BOT_URL + "?start=trade_" + String(sym).replace(/[^A-Za-z0-9]/g, "").slice(0, 40); }
function fmtPrice(p) {
  if (p >= 1) return "$" + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (p >= 0.01) return "$" + p.toFixed(4);
  return "$" + p.toFixed(8);
}
function fmtChg(c) { return (c >= 0 ? "+" : "") + c.toFixed(2) + "%"; }
function fmtBig(v) {
  if (v >= 1e12) return "$" + (v / 1e12).toFixed(2) + "T";
  if (v >= 1e9) return "$" + (v / 1e9).toFixed(1) + "B";
  if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
  return "$" + Math.round(v).toLocaleString("en-US");
}
function flash(el, dir) {
  el.classList.remove("flash-up", "flash-down"); void el.offsetWidth;
  el.classList.add(dir > 0 ? "flash-up" : "flash-down");
}

/* Table rows: every cell links to the bot with the coin in the start parameter. */
var tbody = document.getElementById("rows");
function addRow(c) {
  var tr = document.createElement("tr");
  tr.innerHTML =
    '<td class="rank"><a class="rl" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"></a></td>' +

var query = "";
function matches(c) { return !query || (c.sym + " " + c.name).toLowerCase().indexOf(query) !== -1; }

function paint() {
  coins.forEach(function (c) {
    var tr = c.tr, links = tr.querySelectorAll("a.rl"), href = coinHref(c.sym);
    links.forEach(function (a) { a.href = href; });
    links[0].textContent = c.rank;
    var main = tr.querySelector("a.main");
    main.setAttribute("aria-label", t("open_coin", { s: c.sym }));
    var badge = tr.querySelector(".badge");
    badge.textContent = c.sym.charAt(0); badge.style.background = colorFor(c.sym);
    tr.querySelector(".name-cell b").textContent = c.name;
    tr.querySelector(".name-cell small").textContent = c.sym;
    var pEl = tr.querySelector("a.p"), cEl = tr.querySelector("a.c");
    pEl.textContent = fmtPrice(c.price);
    cEl.textContent = fmtChg(c.chg);
    cEl.className = "rl c " + (c.chg >= 0 ? "up" : "down");
    tr.querySelector(".act").textContent = t("trade");
    if (c.price !== c.last) flash(pEl, c.price - c.last);
    tr.hidden = !matches(c);
  });
  ["BTC", "ETH", "USDT"].forEach(function (sym) {
    var c = bySym[sym]; if (!c) return;
    var card = document.querySelector('[data-card="' + sym + '"]');
    card.querySelector(".stretch").href = coinHref(sym);
    var pEl = card.querySelector("[data-price]"), cEl = card.querySelector("[data-chg]");
    pEl.textContent = fmtPrice(c.price);
    cEl.textContent = fmtChg(c.chg) + (sym === "BTC" ? " (24h)" : "");
    cEl.className = "chg " + (c.chg >= 0 ? "up" : "down");
    if (c.price !== c.last) flash(pEl, c.price - c.last);
  });
  document.querySelectorAll(".tcard .stretch").forEach(function (a) { a.href = coinHref(a.getAttribute("data-coin")); });
  coins.forEach(function (c) { c.last = c.price; });
  drawSpark();
  document.getElementById("st-vol").textContent = volText;
  document.getElementById("updated").textContent = t("updated") + " " + new Date().toLocaleTimeString();
}

function drawSpark() {
  var h = bySym.BTC.hist, svg = document.getElementById("spark");
  if (h.length < 2) { svg.innerHTML = ""; return; }
  var lo = Math.min.apply(null, h), hi = Math.max.apply(null, h), span = (hi - lo) || 1;
  var pts = h.map(function (v, i) { return (i / (h.length - 1) * 200).toFixed(1) + "," + (90 - (v - lo) / span * 75).toFixed(1); });
  var up = h[h.length - 1] >= h[0], col = up ? "var(--up)" : "var(--down)";
  svg.innerHTML = '<defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:' + col + ';stop-opacity:0.35"/><stop offset="1" style="stop-color:' + col + ';stop-opacity:0"/></linearGradient></defs>' +
    '<polygon points="0,100 ' + pts.join(" ") + ' 200,100" fill="url(#sf)"/>' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
}

/* Live feed */
function fetchLive() {
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
  return fetch(API, ctl ? { signal: ctl.signal } : {}).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error("bad status");
    return r.json();
  }).then(function (list) {
    if (!Array.isArray(list) || !list.length) throw new Error("empty");
    var total = 0, seen = {}, next = [];
    list.slice(0, 50).forEach(function (d, i) {
      var sym = String(d.symbol || "").toUpperCase(), c = bySym[sym];
      if (!c) {
        c = { sym: sym, name: d.name, price: d.current_price, chg: 0, vol: 0.001, rank: i + 1, last: d.current_price, hist: [] };
        bySym[sym] = c; addRow(c);
      }
      seen[sym] = true; next.push(c);
      c.name = d.name; c.rank = d.market_cap_rank || (i + 1);
      c.price = d.current_price; c.chg = d.price_change_percentage_24h || 0;
      total += d.total_volume || 0;
      if (sym === "BTC" && d.sparkline_in_7d && d.sparkline_in_7d.price) c.hist = d.sparkline_in_7d.price.slice(-80);
    });
    /* Drop sample-only rows the live list does not contain, and order rows by live rank. */
    coins.forEach(function (c) { if (!seen[c.sym]) { c.tr.remove(); delete bySym[c.sym]; } });
    coins = next;
    coins.forEach(function (c) { tbody.appendChild(c.tr); });
    volText = fmtBig(total);
    setMode(true); paint();
  });
}

/* Simulated feed used when the live feed is unavailable */
function seedHistory() {
  var b = bySym.BTC, p = b.price * 0.97, h = [];
  for (var i = 0; i < 60; i++) { p *= 1 + (Math.random() - 0.46) * 0.006; h.push(p); }
  h[h.length - 1] = b.price; b.hist = h;
}
function tick() {
  coins.forEach(function (c) {
    var step = (Math.random() - 0.5) * 2 * c.vol;
    c.price = c.price * (1 + step);
    if (c.vol > 0.0001) c.chg += step * 100;
  });
  var b = bySym.BTC; b.hist.push(b.price); if (b.hist.length > 80) b.hist.shift();
  paint();
}
var simTimer = null;
function startSim() {
  if (simTimer) return;
  volText = "50";
  seedHistory(); setMode(false); paint();
  simTimer = setInterval(tick, 1800);
}
function stopSim() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }
function poll() {
  fetchLive().then(stopSim).catch(function () { if (modeState !== true) startSim(); });
}
